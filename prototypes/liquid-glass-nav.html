<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass Navigation</title>
<style>
  /* Registered properties so theme colours interpolate instead of snapping. */
  @property --blob-1 { syntax: "<color>"; inherits: true; initial-value: #ff9ad5; }
  @property --blob-2 { syntax: "<color>"; inherits: true; initial-value: #7cc8ff; }
  @property --blob-3 { syntax: "<color>"; inherits: true; initial-value: #ffd27a; }
  @property --bg { syntax: "<color>"; inherits: true; initial-value: #eef1f8; }
  @property --glass-tint { syntax: "<color>"; inherits: true; initial-value: rgba(255, 255, 255, 0.28); }
  @property --text { syntax: "<color>"; inherits: true; initial-value: #1d1d1f; }
  @property --text-muted { syntax: "<color>"; inherits: true; initial-value: rgba(29, 29, 31, 0.62); }
  @property --pill { syntax: "<color>"; inherits: true; initial-value: rgba(255, 255, 255, 0.92); }
  @property --shadow { syntax: "<color>"; inherits: true; initial-value: rgba(30, 40, 90, 0.22); }
  @property --rim { syntax: "<color>"; inherits: true; initial-value: rgba(255, 255, 255, 0.85); }
  @property --spec { syntax: "<number>"; inherits: true; initial-value: 0.85; }

  :root {
    --blob-1: #ff9ad5;
    --blob-2: #7cc8ff;
    --blob-3: #ffd27a;
    --bg: #eef1f8;
    --glass-tint: rgba(255, 255, 255, 0.28);
    --text: #1d1d1f;
    --text-muted: rgba(29, 29, 31, 0.62);
    --pill: rgba(255, 255, 255, 0.92);
    --pill-text: #0a0a0c;
    --shadow: rgba(30, 40, 90, 0.22);
    --rim: rgba(255, 255, 255, 0.85);
    --divider: rgba(29, 29, 31, 0.14);
    --spec: 0.85;
    --glare-strength: 0.9;

    --spring: cubic-bezier(0.34, 1.2, 0.64, 1);
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --theme-dur: 700ms;
  }

  [data-theme="dark"] {
    --blob-1: #6a3cff;
    --blob-2: #00a3ff;
    --blob-3: #ff3d8b;
    --bg: #07080d;
    --glass-tint: rgba(255, 255, 255, 0.07);
    --text: #f5f5f7;
    --text-muted: rgba(245, 245, 247, 0.6);
    --pill: rgba(255, 255, 255, 0.16);
    --pill-text: #ffffff;
    --shadow: rgba(0, 0, 0, 0.6);
    --rim: rgba(255, 255, 255, 0.32);
    --divider: rgba(255, 255, 255, 0.16);
    --spec: 0.42;
    --glare-strength: 0.45;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition:
      --bg var(--theme-dur) var(--ease),
      --blob-1 var(--theme-dur) var(--ease),
      --blob-2 var(--theme-dur) var(--ease),
      --blob-3 var(--theme-dur) var(--ease),
      --glass-tint var(--theme-dur) var(--ease),
      --text var(--theme-dur) var(--ease),
      --text-muted var(--theme-dur) var(--ease),
      --pill var(--theme-dur) var(--ease),
      --shadow var(--theme-dur) var(--ease),
      --rim var(--theme-dur) var(--ease),
      --spec var(--theme-dur) var(--ease);
  }

  /* ---------- Background: animated mesh of three blurred blobs ---------- */
  .mesh {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    width: 56vmax;
    height: 56vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.9;
    will-change: transform;
  }
  .blob--1 { background: var(--blob-1); top: -18vmax; left: -12vmax; animation: drift-1 22s ease-in-out infinite alternate; }
  .blob--2 { background: var(--blob-2); bottom: -22vmax; right: -14vmax; animation: drift-2 26s ease-in-out infinite alternate; }
  .blob--3 { background: var(--blob-3); top: 30%; left: 38%; width: 40vmax; height: 40vmax; animation: drift-3 19s ease-in-out infinite alternate; }

  @keyframes drift-1 { to { transform: translate3d(22vw, 18vh, 0) scale(1.15); } }
  @keyframes drift-2 { to { transform: translate3d(-24vw, -16vh, 0) scale(0.9); } }
  @keyframes drift-3 { to { transform: translate3d(-18vw, 14vh, 0) scale(1.2); } }

  /* Fine grain keeps large blurs from banding. */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Liquid glass bar ---------- */
  .nav {
    --mx: 50%;
    --my: 50%;
    --glare: 0;
    position: relative;
    z-index: 1;
    isolation: isolate;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-tint);
    -webkit-backdrop-filter: blur(50px) saturate(200%);
    backdrop-filter: blur(50px) saturate(200%);
    box-shadow:
      /* rim light along the top edge */
      inset 0 1px 0.5px var(--rim),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.28),
      /* caustic: light refracting through and pooling at the bottom edge */
      inset 0 -10px 18px -12px rgba(255, 255, 255, 0.75),
      inset 0 -1.5px 1px -0.5px rgba(255, 255, 255, 0.5),
      /* volume: a soft darker band where the resin is thickest */
      inset 0 8px 22px -14px rgba(0, 0, 0, 0.18),
      /* contact + ambient drop shadows */
      0 1px 2px var(--shadow),
      0 12px 28px -8px var(--shadow),
      0 34px 70px -24px var(--shadow);
    transition: box-shadow var(--theme-dur) var(--ease);
  }

  /* Specular highlight: a curved, hard reflection on the upper half of a wet dome. */
  .nav::before {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    top: 2px;
    height: 52%;
    border-radius: 999px 999px 60% 60% / 999px 999px 100% 100%;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, calc(var(--spec) * 0.95)) 0%,
      rgba(255, 255, 255, calc(var(--spec) * 0.35)) 45%,
      rgba(255, 255, 255, 0) 100%
    );
    pointer-events: none;
    z-index: -1;
  }

  /* Interactive glare that follows the pointer. */
  .nav::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(140px circle at var(--mx) var(--my), rgba(255, 255, 255, var(--glare-strength)), rgba(255, 255, 255, 0) 70%);
    mix-blend-mode: overlay;
    opacity: var(--glare);
    transition: opacity 400ms var(--ease);
    pointer-events: none;
    z-index: -1;
  }

  /* ---------- Sliding active pill ---------- */
  .pill {
    position: absolute;
    top: 8px;
    left: 0;
    height: calc(100% - 16px);
    width: 0;
    border-radius: 999px;
    background: var(--pill);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 1px rgba(255, 255, 255, 0.25),
      0 1px 2px rgba(0, 0, 0, 0.08),
      0 6px 16px -4px var(--shadow);
    transform: translateX(var(--x, 0px)) scale(var(--sx, 1), var(--sy, 1));
    transition:
      transform 0.5s var(--spring),
      width 0.5s var(--spring);
    z-index: 0;
    pointer-events: none;
  }
  .pill.no-anim { transition: none; }
  [data-theme="dark"] .pill {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 1px rgba(255, 255, 255, 0.08),
      0 6px 16px -4px rgba(0, 0, 0, 0.5);
  }

  /* ---------- Items ---------- */
  .nav__item,
  .theme-toggle {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 15px;
    font-weight: 590;
    letter-spacing: -0.01em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition:
      color 300ms var(--ease),
      transform 260ms var(--spring);
  }
  .nav__item:hover { color: var(--text); }
  .nav__item[aria-current="page"] { color: var(--pill-text); }
  .nav__item:active,
  .theme-toggle:active { transform: scale(0.92); transition-duration: 120ms; }
  .nav__item svg,
  .theme-toggle svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 260ms var(--spring);
  }
  .nav__item:active svg { transform: scale(0.92); }

  .nav__item:focus-visible,
  .theme-toggle:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--blob-2) 80%, white);
    outline-offset: 2px;
  }

  .divider {
    width: 1px;
    height: 24px;
    margin: 0 6px;
    background: var(--divider);
    border-radius: 1px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    width: 44px;
    padding: 0;
    justify-content: center;
    color: var(--text);
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, 0.14); }
  .theme-toggle .icon {
    position: absolute;
    inset: 0;
    margin: auto;
    transition:
      transform 600ms var(--spring),
      opacity 400ms var(--ease);
  }
  .icon--sun { opacity: 1; transform: rotate(0deg) scale(1); }
  .icon--moon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
  [data-theme="dark"] .icon--sun { opacity: 0; transform: rotate(90deg) scale(0.4); }
  [data-theme="dark"] .icon--moon { opacity: 1; transform: rotate(0deg) scale(1); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  @media (max-width: 420px) {
    .nav__item { padding: 0 12px; gap: 6px; font-size: 14px; }
  }
  @media (max-width: 360px) {
    .nav__item span { display: none; }
    .nav__item { padding: 0 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .pill, .nav__item, .theme-toggle, .theme-toggle .icon, .nav::after { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <div class="mesh" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <nav class="nav" id="nav" aria-label="Main">
    <span class="pill" id="pill" aria-hidden="true"></span>

    <button class="nav__item" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5h4.5v-6h4v6h4.5V9"/></svg>
      <span>Home</span>
    </button>
    <button class="nav__item" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h2.6l1.6 4.2-2 1.4a11 11 0 0 0 6.1 6.1l1.4-2 4.2 1.6v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z"/></svg>
      <span>Call</span>
    </button>
    <button class="nav__item" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.75" cy="6.5" r="0.9"/><circle cx="4.75" cy="12" r="0.9"/><circle cx="4.75" cy="17.5" r="0.9"/></svg>
      <span>List</span>
    </button>

    <span class="divider" aria-hidden="true"></span>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
    </button>
  </nav>

<script>
(() => {
  const root = document.documentElement;
  const nav = document.getElementById('nav');
  const pill = document.getElementById('pill');
  const items = Array.from(nav.querySelectorAll('.nav__item'));
  const toggle = document.getElementById('themeToggle');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- Theme ---------- */
  const stored = (() => { try { return localStorage.getItem('lg-theme'); } catch { return null; } })();
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const setTheme = (t) => {
    root.dataset.theme = t;
    toggle.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    try { localStorage.setItem('lg-theme', t); } catch {}
  };
  setTheme(stored || (prefersDark ? 'dark' : 'light'));
  toggle.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

  /* ---------- Sliding pill with a touch of liquid stretch ---------- */
  let current = items.findIndex((el) => el.getAttribute('aria-current') === 'page');
  if (current < 0) current = 0;

  const place = (el, animate) => {
    const x = el.offsetLeft;
    const w = el.offsetWidth;
    if (!animate) pill.classList.add('no-anim');
    pill.style.width = w + 'px';
    pill.style.setProperty('--x', x + 'px');
    if (!animate) {
      pill.getBoundingClientRect(); // commit before re-enabling transitions
      pill.classList.remove('no-anim');
    }
  };

  const select = (index) => {
    if (index === current) return;
    items[current].removeAttribute('aria-current');
    items[index].setAttribute('aria-current', 'page');
    current = index;
    if (!reduce.matches) {
      // Brief squash-and-stretch so the pill reads as liquid, then let the spring settle it.
      pill.style.setProperty('--sx', '1.08');
      pill.style.setProperty('--sy', '0.9');
      setTimeout(() => {
        pill.style.setProperty('--sx', '1');
        pill.style.setProperty('--sy', '1');
      }, 160);
    }
    place(items[index], true);
  };

  items.forEach((el, i) => {
    el.addEventListener('click', () => select(i));
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      const next = (i + (e.key === 'ArrowRight' ? 1 : items.length - 1)) % items.length;
      items[next].focus();
      select(next);
    });
  });

  place(items[current], false);
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => place(items[current], false));
  if ('ResizeObserver' in window) new ResizeObserver(() => place(items[current], false)).observe(nav);
  else window.addEventListener('resize', () => place(items[current], false));

  /* ---------- Pointer-tracked glare (rAF-throttled) ---------- */
  let raf = 0, px = 0, py = 0;
  const paint = () => {
    raf = 0;
    const r = nav.getBoundingClientRect();
    nav.style.setProperty('--mx', (px - r.left) + 'px');
    nav.style.setProperty('--my', (py - r.top) + 'px');
  };
  nav.addEventListener('pointermove', (e) => {
    px = e.clientX; py = e.clientY;
    if (!raf) raf = requestAnimationFrame(paint);
  });
  nav.addEventListener('pointerenter', () => nav.style.setProperty('--glare', '1'));
  nav.addEventListener('pointerleave', () => nav.style.setProperty('--glare', '0'));
})();
</script>
</body>
</html>
